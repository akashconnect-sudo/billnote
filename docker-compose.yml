services:
  redis:
    image: redis:7.4-alpine
    container_name: billnote-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - billnote_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    container_name: billnote-dynamodb
    restart: unless-stopped
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/shell/ || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  billnote_redis_data:
